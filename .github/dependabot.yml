version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    versioning-strategy: lockfile-only
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      vite-toolchain:
        patterns: ["vite-plus", "@vitest/*", "vitest", "@voidzero-dev/*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
