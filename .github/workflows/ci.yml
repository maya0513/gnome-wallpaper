name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
env:
  MISE_LOCKED: "1"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  dependency-artifacts:
    name: dependency-artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      MISE_SAFE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
          cache: false
      - id: mise
        uses: maya0513/renovate-config/.github/actions/mise-pnpm@51775e2b77381182358d48695fa0fc8dbfe0fa42 # main
        with:
          verify-only: "true"
          lock-groups: >-
            [{"lockfile":"mise.lock","tools":["actionlint","node","pnpm","shellcheck","zizmor"],"platforms":["linux-x64","linux-arm64"],"verify":"regenerate"}]
      - id: viteplus
        uses: maya0513/renovate-config/.github/actions/pnpm-viteplus@51775e2b77381182358d48695fa0fc8dbfe0fa42 # main
        with:
          preparation-state: ${{ steps.mise.outputs.state }}
      - id: outputs
        uses: maya0513/renovate-config/.github/actions/pnpm-outputs@51775e2b77381182358d48695fa0fc8dbfe0fa42 # main
        with:
          mise-state: ${{ steps.mise.outputs.state }}
          viteplus-state: ${{ steps.viteplus.outputs.state }}
  configuration:
    name: configuration
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject vulnerable dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
          cache: false
      - name: Install the locked Node and pnpm versions
        run: mise install --locked node pnpm
      - name: Install the exact locked dependencies
        run: mise exec node pnpm -- pnpm install --frozen-lockfile
      - name: Record tool versions
        run: |
          {
            echo '### Toolchain'
            mise --version
            mise exec node pnpm -- node --version
            mise exec node pnpm -- pnpm --version
            mise exec node pnpm -- pnpm exec vp --version
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Actions, shell, and dependency policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec node pnpm -- pnpm exec vp run configuration
  static:
    name: static
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
          cache: false
      - name: Install the locked Node and pnpm versions
        run: mise install --locked node pnpm
      - name: Install the exact locked dependencies
        run: mise exec node pnpm -- pnpm install --frozen-lockfile
      - name: Record tool versions
        run: |
          {
            echo '### Toolchain'
            mise --version
            mise exec node pnpm -- node --version
            mise exec node pnpm -- pnpm --version
            mise exec node pnpm -- pnpm exec vp --version
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check strict lint, formatting, types, and toolchain compatibility
        run: |
          mise exec node pnpm -- pnpm exec vp run toolchain
          mise exec node pnpm -- pnpm exec vp run static
  tests:
    name: tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
          cache: false
      - name: Install the locked Node and pnpm versions
        run: mise install --locked node pnpm
      - name: Install the exact locked dependencies
        run: mise exec node pnpm -- pnpm install --frozen-lockfile
      - name: Record tool versions
        run: |
          {
            echo '### Toolchain'
            mise --version
            mise exec node pnpm -- node --version
            mise exec node pnpm -- pnpm --version
            mise exec node pnpm -- pnpm exec vp --version
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require 100% coverage for every application source file
        run: mise exec node pnpm -- pnpm exec vp run coverage
      - name: Upload test and coverage reports, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage/
            artifacts/unit-tests.xml
          retention-days: 14
          if-no-files-found: error
  native:
    name: native
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
          cache: false
      - name: Install the locked Node and pnpm versions
        run: mise install --locked node pnpm
      - name: Install the exact locked dependencies
        run: mise exec node pnpm -- pnpm install --frozen-lockfile
      - name: Record tool versions
        run: |
          {
            echo '### Toolchain'
            mise --version
            mise exec node pnpm -- node --version
            mise exec node pnpm -- pnpm --version
            mise exec node pnpm -- pnpm exec vp --version
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install native test and ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs gir1.2-soup-3.0 gsettings-desktop-schemas libglib2.0-bin zip unzip
          gjs --version >> "$GITHUB_STEP_SUMMARY"
      - name: Build, test in real GJS, validate the ZIP, and measure size
        run: mise exec node pnpm -- pnpm exec vp run native
      - name: Upload native and size reports, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-reports
          path: |
            artifacts/gjs-integration.json
            artifacts/build-size.json
          retention-days: 14
          if-no-files-found: error
      - name: Show build size in the run summary
        if: success()
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('artifacts/build-size.json', 'utf8'));
          console.log('### Build size\n\n| Artifact | Bytes |\n| --- | ---: |');
          console.log(`| JavaScript | ${report.javascriptBytes} |`);
          console.log(`| Unpacked | ${report.unpackedBytes} |`);
          console.log(`| ZIP | ${report.zipBytes} |`);
          JS
      - name: Upload the validated extension ZIP
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnome-wallpaper
          path: artifacts/*.zip
          retention-days: 14
          if-no-files-found: error
  quality:
    name: quality
    if: always()
    needs: [configuration, static, tests, native, dependency-artifacts]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$RESULTS" | jq -e 'keys == ["configuration", "dependency-artifacts", "native", "static", "tests"] and all(.[]; .result == "success")'
