name: Synchronize dependency artifacts
on:
  push:
    branches: ["renovate/**"]
permissions:
  contents: read
jobs:
  prepare:
    name: prepare
    if: github.event_name == 'push' && github.event.sender.id == 29139614 && startsWith(github.ref, 'refs/heads/renovate/')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: dependency-artifacts-${{ github.ref }}
      cancel-in-progress: true
    env:
      MISE_SAFE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
          cache: false
      - id: mise
        uses: maya0513/renovate-config/.github/actions/mise-pnpm@ecbede8750f082d85e4b99f12e384133e4fc1724 # main
        with:
          verify-only: "false"
          lock-groups: >-
            [{"lockfile":"mise.lock","tools":["actionlint","node","pnpm","shellcheck","zizmor"],"platforms":["linux-x64","linux-arm64"],"verify":"regenerate"}]
      - id: viteplus
        uses: maya0513/renovate-config/.github/actions/pnpm-viteplus@ecbede8750f082d85e4b99f12e384133e4fc1724 # main
        with:
          preparation-state: ${{ steps.mise.outputs.state }}
      - id: outputs
        uses: maya0513/renovate-config/.github/actions/pnpm-outputs@ecbede8750f082d85e4b99f12e384133e4fc1724 # main
        with:
          mise-state: ${{ steps.mise.outputs.state }}
          viteplus-state: ${{ steps.viteplus.outputs.state }}
    outputs:
      base: ${{ steps.outputs.outputs.base }}
      changed: ${{ steps.outputs.outputs.changed }}
      artifact-id: ${{ steps.outputs.outputs.artifact-id }}
  publish:
    needs: prepare
    uses: maya0513/renovate-config/.github/workflows/publish-pnpm-artifacts.yml@ecbede8750f082d85e4b99f12e384133e4fc1724 # main
    with:
      base: ${{ needs.prepare.outputs.base }}
      changed: ${{ needs.prepare.outputs.changed }}
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}
      mise: true
      viteplus: true
      app-client-id: ${{ vars.DEPENDENCY_ARTIFACTS_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.DEPENDENCY_ARTIFACTS_APP_PRIVATE_KEY }}
